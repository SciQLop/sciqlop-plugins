[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sciqlop-kimi"
version = "0.2.0"
description = "Kimi chat dock for SciQLop (drives the Kimi Code CLI over ACP)"
requires-python = ">=3.10"
dependencies = [
    "SciQLop>=0.13.0,<0.14.0",
    "agent-client-protocol>=0.12.0",
    "mcp>=1.19.0,<2",  # <1.19 mangles a CallToolResult from a call_tool handler; 2.0 drops the low-level decorators
    "uvicorn>=0.30.0",
]

[project.entry-points."sciqlop.plugins"]
sciqlop_kimi = "sciqlop_kimi"

[tool.setuptools.packages.find]
include = ["sciqlop_kimi*"]

[tool.setuptools.package-data]
sciqlop_kimi = ["plugin.json", "resources/*"]
