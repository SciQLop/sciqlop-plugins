[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sciqlop-kimi"
version = "0.1.0"
description = "Kimi chat dock for SciQLop (powered by the Kimi CLI runtime via kimi-agent-sdk)"
requires-python = ">=3.10"
dependencies = ["SciQLop>=0.12.0,<0.14.0", "kimi-agent-sdk>=0.0.5"]

[project.entry-points."sciqlop.plugins"]
sciqlop_kimi = "sciqlop_kimi"

[tool.setuptools.packages.find]
include = ["sciqlop_kimi*"]

[tool.setuptools.package-data]
sciqlop_kimi = ["plugin.json", "resources/*"]
