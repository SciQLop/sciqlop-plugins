[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sciqlop-cdf-workbench"
version = "0.7.0"
description = "Multi-function CDF file explorer for SciQLop"
requires-python = ">=3.10"
dependencies = ["pycdfpp>=0.18.0", "httpx", "psutil", "pyyaml", "astralint", "SciQLop>=0.12.0,<0.15.0"]

[project.entry-points."sciqlop.plugins"]
cdf_workbench = "cdf_workbench"

[tool.setuptools.packages.find]
include = ["cdf_workbench*"]

[tool.setuptools.package-data]
cdf_workbench = ["plugin.json"]
