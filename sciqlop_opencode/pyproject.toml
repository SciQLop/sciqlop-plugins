[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sciqlop-opencode"
version = "0.2.1"
description = "Opencode chat dock for SciQLop (drives the opencode CLI over ACP)"
requires-python = ">=3.10"
dependencies = [
    "SciQLop>=0.13.0,<0.14.0",
    "agent-client-protocol>=0.12.0",
    "mcp>=1.19.0,<2",  # <1.19 mangles a CallToolResult from a call_tool handler; 2.0 drops the low-level decorators
    "uvicorn>=0.30.0",
]

[project.entry-points."sciqlop.plugins"]
sciqlop_opencode = "sciqlop_opencode"

[tool.setuptools.packages.find]
include = ["sciqlop_opencode*"]

[tool.setuptools.package-data]
sciqlop_opencode = ["plugin.json", "resources/*"]
